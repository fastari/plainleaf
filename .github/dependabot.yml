# Weekly update pull requests for the GitHub Actions, npm and Composer tooling.
# cooldown: only propose versions that have been out for 14 days, so a bad or
# compromised release has time to be caught first. Security updates skip the wait.
# Security alerts are turned on in the repository settings (Settings > Code security).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm-tooling:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      composer-tooling:
        patterns: ['*']
